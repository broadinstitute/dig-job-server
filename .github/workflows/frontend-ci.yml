name: Frontend CI/CD

on:
    push:
        branches:
            # "**", not "*": a single star stops at a slash, so "*" matched
            # neither dependabot/npm_and_yarn/... nor any other grouped branch
            # name. Every Dependabot PR here had therefore run no CI at all,
            # which is why none of them could be judged safe to merge.
            - "**"
        paths:
            - "frontend/**"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Install dependencies
              working-directory: ./frontend
              run: npm ci

            - name: Test
              working-directory: ./frontend
              run: npm test

            - name: Create .env file
              working-directory: ./frontend
              run: |
                  echo "NUXT_PUBLIC_API_BASE_URL=${{ secrets.API_BASE_URL }}" >> .env
                  echo "NUXT_PUBLIC_PHENOTYPES_URL=${{ secrets.PHENOTYPES_URL }}" >> .env
                  echo "NUXT_PUBLIC_BIOINDEX_URL=https://gwas-ce.kpndataregistry.org/bioidx/api/bio/" >> .env
                  echo "NUXT_PUBLIC_DEFAULT_USERNAME=defaultuser" >> .env
                  echo "NUXT_PUBLIC_DEFAULT_PASSWORD=defaultpass" >> .env
                  echo "NUXT_PUBLIC_GITHUB_AUTH_REDIRECT_URI=https://users.kpndataregistry.org/gh-callback/" >> .env
                  echo "NUXT_PUBLIC_GITHUB_AUTH_CLIENT_ID=${{ secrets.OATH_GITHUB_CLIENT_ID }}" >> .env
                  echo "NUXT_PUBLIC_USER_SERVICE_URL=https://users.kpndataregistry.org" >> .env
                  echo "NUXT_PUBLIC_USER_SERVICE_TOKEN=47c5488c-1660-4133-8700-23c14e942788" >> .env
                  echo "NUXT_PUBLIC_FINAL_REDIRECT_URI=https://gwas-ce.kpndataregistry.org" >> .env
                  echo "NUXT_PUBLIC_USER_GROUP=gwas-ce" >> .env

            - name: Build
              working-directory: ./frontend
              run: npx nuxt generate -v

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: nuxt-build
                  path: frontend/.output/public

    deploy:
        needs: [build]
        if: github.ref == 'refs/heads/main'
        name: Deploy UI
        runs-on: ubuntu-latest
        steps:
            - name: Download Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: nuxt-build

            - name: Clear Remote Directory
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.FRONT_END_DEPLOY_HOST }}
                  username: ec2-user
                  key: ${{ secrets.FRONT_END_SSH_PRIVATE_KEY }}
                  port: 22
                  script: |
                      rm -rf /home/ec2-user/ldserver-frontend/.output/*

            - name: Deploy to Server
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.FRONT_END_DEPLOY_HOST }}
                  username: ec2-user
                  key: ${{ secrets.FRONT_END_SSH_PRIVATE_KEY }}
                  port: 22
                  source: "*"
                  debug: true
                  target: "/home/ec2-user/ldserver-frontend/.output/public"
