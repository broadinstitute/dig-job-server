name: FALCON CLI E2E

on:
  pull_request:
    paths:
      - 'static/run.sh.tmpl'
      - 'tests/run-sh/**'
      - 'job_server/api.py'
      - 'job_server/falcon_tokens.py'
      # Trigger on changes to this workflow too, so CI fixes are validated
      # without needing an unrelated code change (mirrors api-ci.yml).
      - '.github/workflows/falcon-cli-e2e.yml'

jobs:
  bats:
    name: bats run.sh tests
    # Linux-only: all run.sh tests pass on Linux (verified locally). The GitHub
    # macOS runner lacks Docker and the harness hangs there (~16 min then fails),
    # unreproducible on Linux; low value given run.sh is slated for deprecation
    # (FALCON moving to AWS Batch). Re-add a macos-latest leg if that changes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # apt is reliable on the runner; `npm install -g bats` was failing in the
      # runner's global-npm environment before the tests could run.
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run bats
        run: bats tests/run-sh/

  pytest:
    name: pytest endpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Start MySQL
        run: sh docker_db/docker_db.sh start 3308
      - name: Run pytest
        env:
          # MySQL runs on :3308 (see "Start MySQL"); point the suite there
          # explicitly or conftest falls back to :3305 and the connection is
          # refused. Mirrors api-ci.yml.
          TEST_DIG_JOB_SERVER_DB: mysql+pymysql://job_server:job_server@localhost:3308/job_server_test
        run: pytest -q
      - name: Stop MySQL
        if: always()
        run: sh docker_db/docker_db.sh stop

  falcon-prep:
    name: falcon_prep unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Run falcon_prep tests
        # Stdlib-only by design, so no requirements install is needed. This also
        # guards the manifest schema against drifting from job_server/falcon.py.
        run: python -m pytest falcon_prep/ -v
